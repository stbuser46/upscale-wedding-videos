<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private archive · Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <span class="brand-mark large">YA</span>
      <p class="eyebrow">Private family archive</p>
      <h1>Wedding film restoration</h1>
      <p class="muted">Sign in to browse the original DVDs and manage restoration work.</p>
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <form method="post" class="login-form">
        <label>Password<input type="password" name="password" autofocus required autocomplete="current-password"></label>
        <button class="button primary" type="submit">Open archive</button>
      </form>
    </section>
  </main>
</body>
</html>
